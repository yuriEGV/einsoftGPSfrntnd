name: Build & Package EINSoft GPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Web Frontend
        run: |
          npm ci
          npm run build

      - name: Upload APK Release Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: einsoft-gps-apk
          path: public/einsoft-gps.apk
          if-no-files-found: ignore
