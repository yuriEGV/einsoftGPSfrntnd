name: Build EINSoft GPS Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Assets & Capacitor Sync
        run: |
          npm ci
          npm run build
          if [ -d "../mobile-app" ]; then
            cd ../mobile-app && npm ci && npm run build && npx cap sync android
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        run: |
          if [ -d "../mobile-app/android" ]; then
            cd ../mobile-app/android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: einsoft-gps-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
